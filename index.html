<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pausa Labs</title><style>
:root{--fondo:#fdf6f0;--tinta:#2a2226;--suave:#6b5f64;--acento:#c8102e;--panel:#fff;--borde:#eadfd8}
@media (prefers-color-scheme:dark){:root{--fondo:#1d191b;--tinta:#f3ecef;--suave:#b9adb2;--acento:#ff6b81;--panel:#272224;--borde:#3a3236}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fondo);color:var(--tinta);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari","Noto Sans CJK JP",sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 16px 64px}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin-bottom:24px}
.marca{font-weight:800;font-size:20px;color:var(--tinta);text-decoration:none}
nav a,.idiomas a{color:var(--acento);text-decoration:none;font-weight:600}
nav{display:flex;flex-wrap:wrap;gap:12px}
h1{font-size:28px;line-height:1.25;margin:8px 0 4px}h2{font-size:20px;margin:32px 0 8px}
.meta{color:var(--suave);font-size:14px}
ul{padding-left:22px}li{margin:4px 0}
.idiomas{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:0;list-style:none}
.idiomas a{display:block;padding:10px 12px;border:1px solid var(--borde);border-radius:12px;background:var(--panel)}
select{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--borde);background:var(--panel);color:var(--tinta)}
footer{margin-top:48px;color:var(--suave);font-size:14px}
a:focus-visible,select:focus-visible{outline:3px solid var(--acento);outline-offset:2px}
</style></head><body><main>
<header><a class="marca" href="index.html">Rubilia · Pausa Labs</a></header>

<footer>© 2026 Pausa Labs</footer>
</main></body></html>
